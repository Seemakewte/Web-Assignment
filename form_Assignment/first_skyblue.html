<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color:skyblue">
    
     <form>
          <label for="fname">Firstname   &nbsp;&nbsp&nbsp; &nbsp&nbsp; &nbsp&nbsp; </label>
          <input type="text" id="fname" ><br>
          <br>
          <label for="mname">Middlename &nbsp; &nbsp;&nbsp; &nbsp</label>
          <input type="text"id="mname"><br>
          <br>
          <label for="lname">Latname &nbsp; &nbsp;&nbsp; &nbsp&nbsp; &nbsp&nbsp; &nbsp</label>
          <input type="text" id="lname"><br>
          <br>
          <label for="city">Course : </label>
          <select name="city" id="city" >
            <option value="Course" selected>Course</option>
            <option value="B.tech" >B.tech</option>
            <option value="M.tech">M.tech</option>
            <option value="Bsc">Bsc</option>
            <option value="Bca">Bca</option>

          </select>
          <br>
          <br>

          <label >Gender</label>
          <br>
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Male</label>
          <br>
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>
          <br>
          <input type="radio" id="other" name="gender" value="other">
          <label for="other">Other</label>
          <br>
          <br>


          <label for="phone">Phone &nbsp;</label>
          <input type="text" value="+91" style="width: 30px;" id="phone">
          <input type="phone" id="phone" >
          <br>
          <br>

          <label for="address">Address</label>
          <br>

          <textarea id="address" name="address" rows="5" cols="75"></textarea>

          <br>
          <br>

          <label for="Email">Email &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
          <input type="email" id="Email" name="Email" >

          <br>
          <br>
          <label for="pass">Password &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
          <input type="password" id="pass" name="password" minlength="8">
          <br>
          <br>
          <label for="rep">Re-Type password : &nbsp;&nbsp;&nbsp;</label>
          <input type="password" id="rep">
          <br>
          <br>
          <br>

          <button type="submit">Submit</button>
