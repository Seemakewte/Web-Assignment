<!--1.
 Image with Links
Create an HTML page where clicking on an image redirects the user to another website or page.
Use the <a> tag to wrap the <img> tag.
Add multiple linked images with different destinations.

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> my frist website</h1>
    <a href="https://youtube.com" target="_blank">
        <img src="youtube.jpg" alt="youtube" with="200">
    </a>

    <a href="https://www.google.com" target="_blank"> 
        <img src="google.jpg" alt="Google" width="200"> 
    </a>

    <a href="https://www.wikipedia.org" target="_blank"> 
        <img src="wikipedia.jpg" alt="Wikipedia" width="200">
    </a>
</body>
</html>
